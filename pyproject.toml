[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "replux"
version = "0.1.0"
description = "A terminal coding assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.14.0",
    "httpx2==2.13.1",
    "openai==3.31.0",
    "PyYAML==6.0.3",
    "textual==8.2.8",
]

[project.scripts]
replux = "replux.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/replux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/replux", "tests"]
